name: Coleta

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"  # segundas, 06:17 em Brasília

jobs:
  coleta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - run: sumulas --output data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sumulas
          path: data/
